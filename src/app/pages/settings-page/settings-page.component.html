<div class="settings-shell">
  <ql-app-rail />
  <main class="settings-main">
<section class="settings-page">
  <article class="setting-card">
    <h2>Theme</h2>
    <p>Choose how the interface is rendered in your browser.</p>

    <div class="mode-row">
      <button
        class="mode-button"
        [class.active]="theme.preference() === 'light'"
        (click)="setTheme('light')"
      >
        Light
      </button>
      <button
        class="mode-button"
        [class.active]="theme.preference() === 'dark'"
        (click)="setTheme('dark')"
      >
        Dark
      </button>
    </div>
  </article>

  <article class="setting-card danger">
    <h2>Local Data Reset</h2>
    <p>Clear custom datasets, saved history, and current query state from local storage.</p>
    <button class="danger-button" (click)="clearLocalWorkspace()">Clear Local Workspace</button>
  </article>
</section>
  </main>
</div>
