<div class="settings-shell">
  <ql-app-rail />
  <main class="settings-main">
    <div class="content">
      <h1>Settings</h1>

      <section class="section" aria-labelledby="appearance-title">
        <div class="text">
          <h2 id="appearance-title">Appearance</h2>
          <p>System follows your device's light or dark setting.</p>
        </div>
        <ql-segmented
          label="Theme"
          [options]="themeOptions"
          [value]="theme.preference()"
          (valueChange)="setTheme($event)"
        />
      </section>

      <section class="section" aria-labelledby="data-title">
        <div class="text">
          <h2 id="data-title">Local data</h2>
          <p>Removes your imported datasets, saved snapshots and the current query from this browser. This can't be undone.</p>
        </div>
        <button type="button" class="btn btn--danger" [class.armed]="confirming()" (click)="clearLocalWorkspace()">
          {{ confirming() ? 'Click again to confirm' : 'Clear local workspace' }}
        </button>
      </section>
    </div>
  </main>
</div>
