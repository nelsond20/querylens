<div class="condition">
  <ql-select
    class="field"
    [compact]="true"
    [options]="fieldOptions"
    [value]="condition.field"
    (valueChange)="updateField($any($event))"
  />

  @if (fieldType === 'boolean') {
    <span class="operator-fixed" aria-label="equals">=</span>
  } @else {
    <ql-select
      class="operator"
      [compact]="true"
      [options]="operatorOptions"
      [value]="condition.operator"
      (valueChange)="updateOperator($any($event))"
    />
  }

  <button type="button" class="remove" (click)="remove.emit()" aria-label="Remove condition" title="Remove condition">
    <ql-icon name="x" [size]="14" />
  </button>

  @if (fieldType === 'boolean') {
    <select
      class="value"
      aria-label="Value"
      [value]="valueAsText === 'true' || valueAsText === 'false' ? valueAsText : ''"
      (change)="updateValue($any($event.target).value)"
    >
      <option value="" disabled>Choose a value</option>
      <option value="true">true</option>
      <option value="false">false</option>
    </select>
  } @else {
    <input
      class="value"
      aria-label="Value"
      [type]="fieldType === 'date' && condition.operator !== 'in' && condition.operator !== 'notIn' ? 'date' : 'text'"
      [attr.inputmode]="fieldType === 'number' ? 'decimal' : null"
      [value]="localValue()"
      (input)="onInputChange($any($event.target).value)"
      (change)="updateValue($any($event.target).value)"
      [placeholder]="inputPlaceholder"
    />
  }
</div>
